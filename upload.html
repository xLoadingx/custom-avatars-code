<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Avatar Upload</title>

    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #9b4f28;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

            font-family: Impact, Arial Black, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .logo {
            position: fixed;
            bottom: -40px;
            left: 20px;
            width: 200px;
            filter: drop-shadow(4px 4px 0 black);
        }

        .box {
            width: 420px;
            text-align: center;

            transform: scale(1.3);
            transform-origin: center;
        }

        h1 {
            font-family: 'Luckiest Guy', sans-serif;
            color: #FFF129;
            font-size: 52px;
            margin: 0 0 10px;

            text-shadow:
                    -6px 6px 0 black,
                    2.5px 2.5px 0 black,
                    -2.5px 2.5px 0 black,
                    2.5px -2.5px 0 black,
                    -2.5px -2.5px 0 black;
        }

        .panel {
            background: #8a4523;
            border: 4px solid black;
            border-radius: 18px;
            padding: 16px;
            margin-top: 20px;
            box-shadow: -6px 6px 0 black;
        }

        .label {
            font-family: 'Luckiest Guy', sans-serif;
            color: white;
            font-size: 20px;
            margin: 0 0 10px;

            text-shadow:
                    -4px 6px 0 black,
                    2.5px 2.5px 0 black,
                    -2.5px 2.5px 0 black,
                    2.5px -2.5px 0 black,
                    -2.5px -2.5px 0 black;
        }

        .dropzone {
            border: 3px dashed black;
            border-radius: 14px;
            padding: 50px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(0,0,0,0.15);
            cursor: pointer;
            transition: 0.15s;
        }

        .desc {
            margin-bottom: 10px;

            color: white;
            font-size: 16px;
            line-height: 1.4;

            text-shadow:
                    -4px 2px 0 black,
                    -2px 2px 0 black,
                    2px -2px 0 black,
                    -2px -2px 0 black;
        }

        .dropzone.drag {
            background: rgba(0,0,0,0.35);
        }

        .main {
            font-size: 16px;
            color: white;

            text-shadow:
                    -4px 2.5px 0 black,
                    0.5px 2.5px 0 black,
                    -0.5px 2.5px 0 black,
                    0.5px -2.5px 0 black,
                    -0.5px -2.5px 0 black;
        }

        .upload {
            background: #ffd400;
            border: 4px solid black;
            border-radius: 14px;
            padding: 10px;
            width: 100%;
            font-size: 30px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: -6px 6px 0 black;
            color: black;
            font-family: 'Luckiest Guy', sans-serif;
        }

        .upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .uploaded {
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .statusbox {
            background: #8a4523;
            border: 4px solid black;
            border-radius: 14px;
            margin-top: 15px;
            padding: 10px;
            box-shadow: -6px 6px 0 black;
            text-align: left;
            font-size: 18px;

            color: white;
            text-shadow: 1px 1px 0 black;
        }

        .statusbox span {
            color: #FFF129;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Avatar Upload</h1>

    <div class="text desc">
        Send your custom avatar to the server.<br>
        This allows other people to download and see your avatar.
    </div>

    <div class="panel">

        <div class="label">Select Avatar File</div>

        <div class="dropzone" id="dropzone">
            <div class="main" id="fileText">Click or drag file here</div>
        </div>

    </div>

    <button class="upload" onclick="upload()">Upload Avatar</button>

    <div class="statusbox" id="status">
        <span>Status:</span> Waiting for file...
    </div>

</div>

<input type="file" id="fileInput" hidden>

<script>
    const params = new URLSearchParams(window.location.search);
    const playerId = params.get("id");

    let selectedFile = null;

    const fileInput = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");
    const fileText = document.getElementById("fileText");
    const status = document.getElementById("status");

    if (!playerId) {
        status.innerHTML = "<span>Status:</span> Open this page from in-game";
        document.querySelector(".upload").disabled = true;
    }

    dropzone.onclick = () => fileInput.click();

    fileInput.addEventListener("change", () => {
        handleFile(fileInput.files[0]);
    });

    dropzone.addEventListener("dragover", e => {
        e.preventDefault();
        dropzone.classList.add("drag");
    });

    dropzone.addEventListener("dragleave", () => {
        dropzone.classList.remove("drag");
    });

    dropzone.addEventListener("drop", e => {
        e.preventDefault();
        dropzone.classList.remove("drag");
        handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
        if (!file) return;

        selectedFile = file;

        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);

        fileText.innerHTML = `
        ${file.name}<br>
        <span style="font-size:12px; opacity:0.8;">${sizeMB} MB</span>`;

        status.innerHTML = "<span>Status:</span> Ready to upload";
    }

    async function isSameAsServer(file) {
        const apiUrl = `https://api.github.com/repos/xLoadingx/custom-avatars/contents/avatars/${playerId}.rumbleavatar`;

        try {
            const res = await fetch(apiUrl, {
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Cache-Control": "no-cache"
                }
            });

            if (!res.ok) return false;

            const data = await res.json();

            const serverBase64 = data.content.replace(/\n/g, "");
            const localBase64 = (await fileToBase64(file));

            return serverBase64 === localBase64;
        } catch {
            return false;
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => {
                resolve(reader.result.split(',')[1]);
            };
            reader.readAsDataURL(file);
        });
    }

    async function upload() {
        if (!selectedFile) {
            status.innerHTML = "<span>Status:</span> No file";
            return;
        }

        const same = await isSameAsServer(selectedFile);

        if (same) {
            status.innerHTML = "<span>Status:</span> Already up to date";
            return;
        }

        status.innerHTML = "<span>Status:</span> Preparing...";

        const token = ["githu", "b_pat_11AVGKZJY0q4OMts4T3Zmf_t1n3qAZFmjrM5KOMuh3ya69ZnRBVgYc9tg1CbOrS4VFHEADMQH5AwIUi32N"].join("");
        const owner = "xLoadingx";
        const repo = "custom-avatars";
        const path = `avatars/${playerId}.rumbleavatar`;

        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

        const reader = new FileReader();

        reader.onload = async () => {
            const content = reader.result.split(',')[1];

            // check if file exists because github doesn't let you override if not
            let sha = null;
            try {
                const existing = await fetch(apiUrl, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (existing.ok) {
                    const data = await existing.json();
                    sha = data.sha;
                }
            } catch {}

            const body = JSON.stringify({
                message: `upload ${playerId}.rumbleavatar`,
                content: content,
                ...(sha && { sha })
            });

            const xhr = new XMLHttpRequest();
            xhr.open("PUT", apiUrl);

            xhr.setRequestHeader("Authorization", `Bearer ${token}`);
            xhr.setRequestHeader("Content-Type", "application/json");

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    status.innerHTML = `<span>Status:</span> Uploading ${percent}%`;
                }
            };

            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    status.innerHTML = `<span>Status:</span> Uploaded ${selectedFile.name}!`;

                    status.classList.add("uploaded");
                    setTimeout(() => status.classList.remove("uploaded"), 300);
                } else {
                    try {
                        const err = JSON.parse(xhr.responseText);
                        status.innerHTML = "<span>Status:</span> Failed: " + err.message;
                    } catch {
                        status.innerHTML = "<span>Status:</span> Upload failed";
                    }
                }
            };

            xhr.onerror = () => {
                status.innerHTML = "<span>Status:</span> Network error";
            };

            xhr.send(body);
        };

        reader.readAsDataURL(selectedFile);
    }
</script>

</body>
</html>
